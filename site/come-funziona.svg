<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="t d">
  <title id="t">Come funziona Dixit</title>
  <desc id="d">Dalla call al riassunto in cinque passi, tutto sul Mac: la call inizia e Dixit si accende, trascrizione live, trascrizione definitiva, chi ha detto cosa, riassunto per tipo di call. Alla fine una cartella per riunione.</desc>
  <style>
    .bg { fill: #FFFFFF; }
    .ink { fill: #2A2A2C; }
    .soft { fill: #62656A; }
    .line { stroke: #E2E6E9; }
    .accent { fill: #1F8093; }
    .accent-s { stroke: #1F8093; }
    .me { fill: #457D17; }
    .s1 { fill: #1A77AD; }
    .s2 { fill: #A9610A; }
    .band { fill: #F4F5F6; }
    .num { fill: #FFFFFF; }
    text { font-family: Montserrat, "Open Sans", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
    .h { font-size: 15px; font-weight: 600; }
    .b { font-size: 13px; font-family: "Open Sans", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #2A2A2C; }
      .ink { fill: #F2F2F3; }
      .soft { fill: #AAACB1; }
      .line { stroke: #404145; }
      .accent { fill: #30AAC5; }
      .accent-s { stroke: #30AAC5; }
      .me { fill: #8DC828; }
      .s1 { fill: #5BB7EC; }
      .s2 { fill: #F2A74A; }
      .band { fill: #343437; }
      .num { fill: #2A2A2C; }
    }
  </style>
  <rect class="bg" width="960" height="330" rx="12"/>

  <!-- the sequence line -->
  <line class="accent-s" x1="96" y1="52" x2="864" y2="52" stroke-width="2"/>

  <g>
    <circle class="accent" cx="96" cy="52" r="16"/><text class="num h" x="96" y="57" text-anchor="middle">1</text>
    <text class="ink h" x="96" y="98" text-anchor="middle">Inizia la call</text>
    <text class="soft b" x="96" y="122" text-anchor="middle"><tspan x="96">Dixit si accende da solo</tspan><tspan x="96" dy="18">con Teams, Zoom o Meet.</tspan></text>
  </g>
  <g>
    <circle class="accent" cx="288" cy="52" r="16"/><text class="num h" x="288" y="57" text-anchor="middle">2</text>
    <text class="ink h" x="288" y="98" text-anchor="middle">Trascrizione live</text>
    <text class="soft b" x="288" y="122" text-anchor="middle"><tspan x="288">Il testo compare mentre</tspan><tspan x="288" dy="18">si parla. Tu aggiungi note.</tspan></text>
  </g>
  <g>
    <circle class="accent" cx="480" cy="52" r="16"/><text class="num h" x="480" y="57" text-anchor="middle">3</text>
    <text class="ink h" x="480" y="98" text-anchor="middle">Trascrizione definitiva</text>
    <text class="soft b" x="480" y="122" text-anchor="middle"><tspan x="480">A fine call Whisper large-v3</tspan><tspan x="480" dy="18">riscrive tutto, più preciso.</tspan></text>
  </g>
  <g>
    <circle class="accent" cx="672" cy="52" r="16"/><text class="num h" x="672" y="57" text-anchor="middle">4</text>
    <text class="ink h" x="672" y="98" text-anchor="middle">Chi ha detto cosa</text>
    <text class="soft b" x="672" y="122" text-anchor="middle"><tspan x="672">Nomi da Teams, oppure</tspan><tspan x="672" dy="18">le voci già riconosciute.</tspan></text>
  </g>
  <g>
    <circle class="accent" cx="864" cy="52" r="16"/><text class="num h" x="864" y="57" text-anchor="middle">5</text>
    <text class="ink h" x="864" y="98" text-anchor="middle">Riassunto</text>
    <text class="soft b" x="864" y="122" text-anchor="middle"><tspan x="864">Sceglie la forma giusta:</tspan><tspan x="864" dy="18">SAL, analisi o mix.</tspan></text>
  </g>

  <!-- what you get: one folder per meeting -->
  <rect class="band" x="32" y="186" width="896" height="112" rx="8"/>
  <text class="ink h" x="56" y="218">Una cartella per riunione, in Documenti/Dixit</text>
  <text class="b" x="56" y="248"><tspan class="me" font-weight="600">Tu</tspan><tspan class="soft">  Partiamo dalla demo di giovedì.</tspan></text>
  <text class="b" x="56" y="272"><tspan class="s1" font-weight="600">Paola</tspan><tspan class="soft">  La build è pronta, manca il test sui permessi.</tspan></text>
  <line class="line" x1="520" y1="206" x2="520" y2="278" stroke-width="1"/>
  <text class="soft b" x="544" y="248"><tspan x="544">Audio, trascrizione con le tue note,</tspan><tspan x="544" dy="24">riassunto e metadati. Niente esce dal Mac.</tspan></text>
</svg>
