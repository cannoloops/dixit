<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Dixit</title>
<style>
  /* Call-start banner (autopilot/banner.rs): 380×96, transparent window, top right.
     Dixit design system, tokens copied from src/app/globals.css: popover surface, live red only
     for the recording light, destructive outline for Annulla, petrolio for OK.
     Fonts self-hosted (Google Fonts, Latin subset, variable weight). */
  @font-face {
    font-family: 'Montserrat';
    font-weight: 100 900;
    font-display: block;
    src: url(fonts/montserrat-latin.woff2) format('woff2');
  }
  @font-face {
    font-family: 'Open Sans';
    font-weight: 300 800;
    font-display: block;
    src: url(fonts/open-sans-latin.woff2) format('woff2');
  }
  :root {
    --popover: 0 0% 100%;
    --popover-foreground: 240 2% 17%;
    --muted-foreground: 218 4% 40%;
    --border: 210 12% 90%;
    --primary: 190 65% 35%;
    --primary-foreground: 0 0% 100%;
    --destructive: 358 56% 49%;
    --ring: 190 65% 35%;
    --live: 358 67% 54%;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --popover: 240 3% 21%;
      --popover-foreground: 240 4% 95%;
      --muted-foreground: 223 4% 68%;
      --border: 228 4% 26%;
      --primary: 191 61% 48%;
      --primary-foreground: 194 44% 10%;
      --destructive: 358 82% 68%;
      --ring: 191 61% 48%;
      --live: 358 100% 68%;
    }
  }
  html, body { margin: 0; height: 100%; background: transparent; }
  body {
    font: 13px/1.4 'Open Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    color: hsl(var(--popover-foreground));
    -webkit-user-select: none; user-select: none; cursor: default;
    -webkit-font-smoothing: antialiased;
  }
  .banner {
    box-sizing: border-box; height: 100%; padding: 14px 14px 13px 16px;
    display: flex; flex-direction: column; justify-content: space-between;
    background: hsl(var(--popover));
    border: 1px solid hsl(var(--border));
    border-radius: 8px;
    overflow: hidden;
  }
  .head { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .live { position: relative; flex: none; width: 8px; height: 8px; }
  .live span { position: absolute; inset: 0; border-radius: 50%; background: hsl(var(--live)); }
  .live span:first-child { animation: ping 1.4s cubic-bezier(0, 0, 0.2, 1) infinite; opacity: 0.6; }
  @keyframes ping { 75%, 100% { transform: scale(2.2); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .live span:first-child { animation: none; opacity: 0; } }
  .title {
    min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    font: 600 15px/20px 'Montserrat', 'Open Sans', sans-serif;
  }
  .foot { display: flex; align-items: center; gap: 8px; }
  .sub { flex: 1; min-width: 0; font-size: 12px; color: hsl(var(--muted-foreground)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button {
    font: 600 13px/1 'Open Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    height: 28px; padding: 0 12px; border-radius: 6px; cursor: default;
    border: 1px solid transparent;
    transition: background-color 150ms, color 150ms, opacity 150ms;
  }
  button:focus-visible { outline: 2px solid hsl(var(--ring)); outline-offset: 2px; }
  button:disabled { opacity: 0.6; }
  .cancel { background: transparent; color: hsl(var(--destructive)); border-color: hsl(var(--destructive) / 0.5); }
  .cancel:hover:not(:disabled) { background: hsl(var(--destructive) / 0.08); }
  .ok { background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); min-width: 48px; }
  .ok:hover:not(:disabled) { background: hsl(var(--primary) / 0.9); }
</style>
</head>
<body>
<div class="banner">
  <div class="head">
    <span class="live" role="img" id="live"><span></span><span></span></span>
    <div class="title" id="title"></div>
  </div>
  <div class="foot">
    <div class="sub" id="sub"></div>
    <button class="cancel" id="cancel"></button>
    <button class="ok" id="ok">OK</button>
  </div>
</div>
<script>
  const it = (navigator.language || '').toLowerCase().startsWith('it');
  const s = it
    ? { started: 'Registrazione avviata', sub: 'Dixit sta registrando questa call.', live: 'In registrazione', cancel: 'Annulla', cancelling: 'Annullo…' }
    : { started: 'Recording started', sub: 'Dixit is recording this call.', live: 'Recording', cancel: 'Cancel', cancelling: 'Cancelling…' };
  document.documentElement.lang = it ? 'it' : 'en';
  const meeting = (new URLSearchParams(location.search).get('title') || '').trim() || s.started;
  const title = document.getElementById('title');
  title.textContent = meeting;
  title.title = meeting;
  document.getElementById('sub').textContent = s.sub;
  document.getElementById('live').setAttribute('aria-label', s.live);
  const cancel = document.getElementById('cancel');
  cancel.textContent = s.cancel;

  const invoke = (cmd) => window.__TAURI__.core.invoke(cmd);
  cancel.onclick = async () => {
    cancel.disabled = true;
    cancel.textContent = s.cancelling;
    try { await invoke('autopilot_cancel'); } finally { invoke('autopilot_banner_close'); }
  };
  document.getElementById('ok').onclick = () => invoke('autopilot_banner_close');
</script>
</body>
</html>
